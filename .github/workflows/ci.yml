name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (pure Go)
        run: go test ./...

  test-duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev
      - name: Test (DuckDB tag)
        env:
          CGO_ENABLED: "1"
        run: go test -tags duckdb ./internal/duckdblocal/... ./internal/executor/...

  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate slim folder
        run: python scripts/standalone/init-standalone.py --user standalone --out dist --force
      - name: Build and validate slim folder
        working-directory: dist/qllm-standalone
        env:
          QLLM_SQLITE_PATH: data/app.db
          QLLM_AUTH_TOKEN: ci
        run: |
          go build -o qllm ./cmd/qllm
          ./qllm validate --config-dir ./config
