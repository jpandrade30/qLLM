apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qllm-egress
spec:
  podSelector: { matchLabels: { app: qllm } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8088 }
        - { protocol: TCP, port: 8089 }
  egress:
    - to: [{ podSelector: { matchLabels: { app: fleet-pg } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app: fleet-ch } } }]
      ports: [{ protocol: TCP, port: 9000 }]
    - to: [{ podSelector: { matchLabels: { app: fleet-ddb } } }]
      ports: [{ protocol: TCP, port: 8000 }]
    - to: [{ podSelector: { matchLabels: { app: fleet-api } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
