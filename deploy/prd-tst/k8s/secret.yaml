# Simulation secrets only. Real PRD: SealedSecret / ExternalSecrets, never this file.
apiVersion: v1
kind: Secret
metadata:
  name: qllm-prd-secrets
  namespace: qllm-prd
  labels:
    qllm.dev/world: fleet-ops
type: Opaque
stringData:
  QLLM_AUTH_TOKEN: fleet-prd-token
  QLLM_FLEET_AGENT_KEY: fleet-prd-token
  QLLM_FLEET_PG_HOST: fleet-pg
  QLLM_FLEET_PG_USER: fleet
  QLLM_FLEET_PG_PASSWORD: fleet-sim
  QLLM_FLEET_CH_HOST: fleet-ch
  QLLM_FLEET_CH_USER: fleet
  QLLM_FLEET_CH_PASSWORD: fleet-sim
  QLLM_FLEET_SQLITE_PATH: /data/fleet.db
  QLLM_FLEET_DDB_ENDPOINT: http://fleet-ddb:8000
  QLLM_FLEET_API_BASE_URL: http://fleet-api:8080
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_EC2_METADATA_DISABLED: "true"
