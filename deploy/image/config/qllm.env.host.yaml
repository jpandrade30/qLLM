# Optional: copy values into process env when running qllm on the HOST
# against published compose ports. ApplyEnvFile only loads qllm.env.yaml.
# Process env wins over qllm.env.yaml — export secrets before `qllm serve`:
#
#   $env:QLLM_AUTH_TOKEN="change-me"
#   $env:QLLM_CRM_PG_PASSWORD="qllm"
#   $env:QLLM_BILLING_MYSQL_PASSWORD="qllm"
#   $env:QLLM_CRM_PG_HOST="127.0.0.1"
#   $env:QLLM_BILLING_MYSQL_HOST="127.0.0.1"
#   $env:QLLM_EVENTS_MONGO_URI="mongodb://127.0.0.1:27017"
#   $env:QLLM_LEGACY_API_BASE_URL="http://127.0.0.1:18080"
#
# Container image uses qllm.env.yaml (compose DNS + ${VAR} for secrets), not this file.
env:
  QLLM_AUTH_TOKEN: ${QLLM_AUTH_TOKEN}
  QLLM_CRM_PG_HOST: "127.0.0.1"
  QLLM_CRM_PG_USER: qllm
  QLLM_CRM_PG_PASSWORD: ${QLLM_CRM_PG_PASSWORD}
  QLLM_BILLING_MYSQL_HOST: "127.0.0.1"
  QLLM_BILLING_MYSQL_USER: qllm
  QLLM_BILLING_MYSQL_PASSWORD: ${QLLM_BILLING_MYSQL_PASSWORD}
  QLLM_EVENTS_MONGO_URI: mongodb://127.0.0.1:27017
  QLLM_LEGACY_API_BASE_URL: http://127.0.0.1:18080
