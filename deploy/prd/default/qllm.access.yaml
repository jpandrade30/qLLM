# Product-image example (D16/D24). File present → per-app keys replace authTokenEnv.
apps:
  - name: crm-limited
    key: ${QLLM_CRM_LIMITED_KEY}
    tables: [customers, addresses]
    fields:
      customers: [id, email, full_name, country, created_at]
  - name: admin
    key: ${QLLM_AUTH_TOKEN}
    tables: ["*"]
