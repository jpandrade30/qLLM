# Container / compose network (service DNS). Secrets are ${VAR} — compose or K8s injects values.
# ApplyEnvFile never writes the placeholder string if the named env is empty.
env:
  QLLM_AUTH_TOKEN: ${QLLM_AUTH_TOKEN}
  QLLM_CRM_PG_HOST: postgres
  QLLM_CRM_PG_USER: qllm
  QLLM_CRM_PG_PASSWORD: ${QLLM_CRM_PG_PASSWORD}
  QLLM_BILLING_MYSQL_HOST: mysql
  QLLM_BILLING_MYSQL_USER: qllm
  QLLM_BILLING_MYSQL_PASSWORD: ${QLLM_BILLING_MYSQL_PASSWORD}
  QLLM_EVENTS_MONGO_URI: mongodb://mongodb:27017
  QLLM_LEGACY_API_BASE_URL: http://test-api:8080
