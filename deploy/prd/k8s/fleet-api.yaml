apiVersion: v1
kind: Service
metadata:
  name: fleet-api
spec:
  selector: { app: fleet-api }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-api
spec:
  replicas: 1
  selector: { matchLabels: { app: fleet-api } }
  template:
    metadata:
      labels: { app: fleet-api, qllm.dev/world: fleet-ops }
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: src, mountPath: /app, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
      volumes:
        - name: src
          configMap: { name: fleet-api-src }
