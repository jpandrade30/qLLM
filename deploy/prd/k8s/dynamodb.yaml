apiVersion: v1
kind: Service
metadata:
  name: fleet-ddb
spec:
  selector: { app: fleet-ddb }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-ddb
spec:
  replicas: 1
  selector: { matchLabels: { app: fleet-ddb } }
  template:
    metadata:
      labels: { app: fleet-ddb, qllm.dev/world: fleet-ops }
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:2.5.3
          args: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 5
