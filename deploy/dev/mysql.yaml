apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: qllm-dev
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: billing
  MYSQL_USER: qllm
  MYSQL_PASSWORD: qllm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: qllm-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uqllm", "-pqllm"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: qllm-dev
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
