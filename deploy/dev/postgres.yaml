apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: qllm-dev
type: Opaque
stringData:
  POSTGRES_USER: qllm
  POSTGRES_PASSWORD: qllm
  POSTGRES_DB: crm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: qllm-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "qllm"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: qllm-dev
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
