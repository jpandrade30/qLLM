apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qllm-dev
resources:
  - namespace.yaml
  - postgres.yaml
  - mysql.yaml
  - mongodb.yaml
  - test-api.yaml
configMapGenerator:
  - name: test-api-code
    files:
      - main.py=test-api/main.py
      - data.json=test-api/data.json
generatorOptions:
  disableNameSuffixHash: true
