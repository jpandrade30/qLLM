apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: qllm-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        # Cluster Datadog admission breaks mongosh probes (NODE_OPTIONS preload).
        admission.datadoghq.com/enabled: "false"
      annotations:
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: qllm-dev
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
