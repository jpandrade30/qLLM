# Test satellites (DBs + test-api). qllm image uses Dockerfile.dev (deploy/image/config).
# (preset, catalog, bind, compose DNS). fixtures/ is seed/API/golden queries — not catalog.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qllm
      POSTGRES_PASSWORD: qllm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qllm"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing
      MYSQL_USER: qllm
      MYSQL_PASSWORD: qllm
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uqllm", "-pqllm"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-api:
    build: ./fixtures/test-api
    ports:
      - "18080:8080"
    volumes:
      - ./fixtures/test-api/data.json:/app/data.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  qllm:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      QLLM_AUTH_TOKEN: change-me
      QLLM_CRM_PG_PASSWORD: qllm
      QLLM_BILLING_MYSQL_PASSWORD: qllm
    ports:
      - "8088:8088"
      - "8089:8089"
    volumes:
      - ./deploy/image/config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      test-api:
        condition: service_healthy

volumes:
  pgdata:
  mysqldata:
  mongodata:
